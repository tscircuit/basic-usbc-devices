name: Validate circuit artifacts
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python3 -m pip install -r requirements-routing.txt
      - run: bun build.tsx hub
      - run: bun run build:display
      - run: bun run build:buzzer
      - run: bun run build:resetter
      - run: bun run check:physical
      - run: bun run build:panel3
      - run: bun run build:panel4
      - run: bun run check
      - run: bun run test
